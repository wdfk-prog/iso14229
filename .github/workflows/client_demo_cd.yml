name: client_demo CD

on:
  push:
    tags:
      - 'client_demo-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example: client_demo-v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  CLIENT_DEMO_DIR: examples/rtt_server/client_demo
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

concurrency:
  group: client-demo-cd-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build and package Linux client_demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential linux-libc-dev

      - name: Configure Linux build
        run: |
          cmake \
            -S "$CLIENT_DEMO_DIR" \
            -B "$CLIENT_DEMO_DIR/build-release-linux" \
            -G Ninja

      - name: Build Linux target
        run: |
          cmake --build "$CLIENT_DEMO_DIR/build-release-linux" --parallel

      - name: Smoke test help output
        run: |
          "$CLIENT_DEMO_DIR/build-release-linux/client" --help

      - name: Package Linux release asset
        shell: bash
        run: |
          set -euo pipefail
          asset_root="$CLIENT_DEMO_DIR/dist/${RELEASE_TAG}-linux-x86_64"
          archive_path="$CLIENT_DEMO_DIR/dist/${RELEASE_TAG}-linux-x86_64.tar.gz"

          rm -rf "$asset_root" "$archive_path" "$archive_path.sha256"
          mkdir -p "$asset_root"

          cp "$CLIENT_DEMO_DIR/build-release-linux/client" "$asset_root/"
          cp "examples/rtt_server/README.md" "$asset_root/README.md"
          cp "examples/rtt_server/docs/linux-build.md" "$asset_root/linux-build.md"

          tar -C "$CLIENT_DEMO_DIR/dist" -czf "$archive_path" "$(basename "$asset_root")"
          sha256sum "$archive_path" > "$archive_path.sha256"

      - name: Upload Linux packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-release-linux
          path: |
            examples/rtt_server/client_demo/dist/${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz
            examples/rtt_server/client_demo/dist/${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build and package Windows client_demo
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}
        working-directory: examples/rtt_server/client_demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure Windows build
        run: |
          rm -rf build-mingw64 dist
          cmake --preset windows-pycan-mingw64

      - name: Build Windows target
        run: |
          cmake --build --preset build-client-pycan --parallel

      - name: Smoke test help output
        run: |
          ./build-mingw64/client.exe --help

      - name: Prepare Windows release payload
        run: |
          set -euo pipefail
          asset_root="dist/${RELEASE_TAG}-windows-x86_64"

          rm -rf "$asset_root"
          mkdir -p "$asset_root/tools"

          cp build-mingw64/client.exe "$asset_root/"
          cp ../README.md "$asset_root/README.md"
          cp ../docs/windows-build.md "$asset_root/windows-build.md"
          cp tools/pycan_bridge.py "$asset_root/tools/"
          cp tools/pycan_runtime.py "$asset_root/tools/"
          cp tools/requirements-pycan.txt "$asset_root/tools/"

      - name: Create Windows release archive
        shell: pwsh
        run: |
          $archiveBase = "dist/${{ env.RELEASE_TAG }}-windows-x86_64"
          $zipPath = "$archiveBase.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $archiveBase -DestinationPath $zipPath -Force
          Get-FileHash -Algorithm SHA256 $zipPath | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $zipPath -Leaf)" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii
          }

      - name: Upload Windows packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-release-windows
          path: |
            examples/rtt_server/client_demo/dist/${{ env.RELEASE_TAG }}-windows-x86_64.zip
            examples/rtt_server/client_demo/dist/${{ env.RELEASE_TAG }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@v5
        with:
          name: client-demo-release-linux
          path: release-assets

      - name: Download Windows release artifact
        uses: actions/download-artifact@v5
        with:
          name: client-demo-release-windows
          path: release-assets

      - name: Show packaged assets
        run: |
          ls -lah release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="client_demo ${RELEASE_TAG}"
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; assets will be replaced."
          else
            gh release create "$RELEASE_TAG" \
              -R "$REPO" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              "${prerelease_flag[@]}"
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" -R "$REPO" "${assets[@]}" --clobber
