name: client_demo Doxygen

on:
  push:
    branches: [ main, rtt ]
    paths:
      - .github/workflows/client_demo_doxygen.yml
      - examples/rtt_server/client_demo/**
      - examples/rtt_server/iso14229.c
      - examples/rtt_server/iso14229.h
  pull_request:
    branches: [ main, rtt ]
    paths:
      - .github/workflows/client_demo_doxygen.yml
      - examples/rtt_server/client_demo/**
      - examples/rtt_server/iso14229.c
      - examples/rtt_server/iso14229.h
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-demo-doxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-doxygen:
    name: Build Doxygen HTML artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate temporary Doxyfile
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Doxyfile.client_demo" <<'EOF'
          DOXYFILE_ENCODING      = UTF-8
          PROJECT_NAME           = "rtt_server client_demo"
          PROJECT_BRIEF          = "Linux and Windows UDS client demo for the RT-Thread server example"
          PROJECT_NUMBER         = generated-by-ci

          OUTPUT_DIRECTORY       = examples/rtt_server/client_demo/build/doxygen
          CREATE_SUBDIRS         = NO
          ALLOW_UNICODE_NAMES    = YES
          OUTPUT_LANGUAGE        = English
          BRIEF_MEMBER_DESC      = YES
          REPEAT_BRIEF           = YES

          OPTIMIZE_OUTPUT_FOR_C  = YES
          TYPEDEF_HIDES_STRUCT   = YES

          INPUT                  = \
                                   examples/rtt_server/client_demo/main.c \
                                   examples/rtt_server/client_demo/core \
                                   examples/rtt_server/client_demo/services \
                                   examples/rtt_server/client_demo/platform \
                                   examples/rtt_server/client_demo/transport \
                                   examples/rtt_server/client_demo/utils \
                                   examples/rtt_server/iso14229.c \
                                   examples/rtt_server/iso14229.h

          FILE_PATTERNS          = *.c \
                                   *.h

          RECURSIVE              = YES
          EXCLUDE                = \
                                   build \
                                   build-ci-linux \
                                   build-mingw64 \
                                   .venv \
                                   .git \
                                   .github

          EXCLUDE_PATTERNS       = \
                                   */build/* \
                                   */build-ci-linux/* \
                                   */build-mingw64/* \
                                   */.venv/* \
                                   */.git/* \
                                   */.github/*

          EXTRACT_ALL            = YES
          EXTRACT_STATIC         = YES
          EXTRACT_LOCAL_CLASSES  = YES
          EXTRACT_PRIVATE        = NO
          HIDE_UNDOC_MEMBERS     = NO
          HIDE_UNDOC_CLASSES     = NO

          SORT_MEMBER_DOCS       = YES
          SORT_BRIEF_DOCS        = YES
          SORT_BY_SCOPE_NAME     = YES

          GENERATE_HTML          = YES
          HTML_OUTPUT            = html
          HTML_FILE_EXTENSION    = .html
          GENERATE_TREEVIEW      = YES
          FULL_SIDEBAR           = YES
          HTML_DYNAMIC_MENUS     = YES
          SEARCHENGINE           = YES
          SERVER_BASED_SEARCH    = NO

          GENERATE_LATEX         = NO
          GENERATE_MAN           = NO
          GENERATE_RTF           = NO
          GENERATE_XML           = NO

          SOURCE_BROWSER         = YES
          INLINE_SOURCES         = NO
          REFERENCES_RELATION    = YES
          REFERENCED_BY_RELATION = YES
          SHOW_INCLUDE_FILES     = YES
          SHOW_HEADERFILE        = YES

          HAVE_DOT               = YES
          DOT_IMAGE_FORMAT       = svg
          INTERACTIVE_SVG        = YES
          CALL_GRAPH             = YES
          CALLER_GRAPH           = YES
          CLASS_GRAPH            = YES
          COLLABORATION_GRAPH    = YES
          INCLUDE_GRAPH          = YES
          INCLUDED_BY_GRAPH      = YES
          DIRECTORY_GRAPH        = YES
          GROUP_GRAPHS           = YES
          UML_LOOK               = YES
          DOT_NUM_THREADS        = 0

          QUIET                  = NO
          WARNINGS               = YES
          WARN_IF_UNDOCUMENTED   = NO
          WARN_IF_DOC_ERROR      = YES
          EOF

      - name: Build Doxygen HTML
        run: |
          rm -rf examples/rtt_server/client_demo/build/doxygen
          mkdir -p examples/rtt_server/client_demo/build/doxygen
          doxygen "$RUNNER_TEMP/Doxyfile.client_demo"

      - name: Upload Doxygen HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-doxygen-html
          path: examples/rtt_server/client_demo/build/doxygen/html
          if-no-files-found: error
