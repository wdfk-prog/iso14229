name: Documentation

on:
  push:
    branches: [ main, rtt, doxygen ]
  pull_request:
    branches: [ main, rtt ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Build main documentation
      run: |
        rm -rf html
        doxygen Doxyfile

    - name: Build client_demo documentation
      run: |
        cat > "$RUNNER_TEMP/Doxyfile.client_demo" <<'EOF'
        DOXYFILE_ENCODING      = UTF-8
        PROJECT_NAME           = "rtt_server client_demo"
        PROJECT_BRIEF          = "Linux and Windows UDS client demo for the RT-Thread server example"
        PROJECT_NUMBER         = generated-by-ci

        OUTPUT_DIRECTORY       = build/client_demo_doxygen
        CREATE_SUBDIRS         = NO
        ALLOW_UNICODE_NAMES    = YES
        OUTPUT_LANGUAGE        = English
        BRIEF_MEMBER_DESC      = YES
        REPEAT_BRIEF           = YES

        OPTIMIZE_OUTPUT_FOR_C  = YES
        TYPEDEF_HIDES_STRUCT   = YES

        INPUT                  = \
                                 examples/rtt_server/client_demo/main.c \
                                 examples/rtt_server/client_demo/core \
                                 examples/rtt_server/client_demo/services \
                                 examples/rtt_server/client_demo/platform \
                                 examples/rtt_server/client_demo/transport \
                                 examples/rtt_server/client_demo/utils \
                                 examples/rtt_server/iso14229.c \
                                 examples/rtt_server/iso14229.h

        FILE_PATTERNS          = *.c \
                                 *.h

        RECURSIVE              = YES
        EXCLUDE                = \
                                 build \
                                 build-ci-linux \
                                 build-mingw64 \
                                 .venv \
                                 .git \
                                 .github

        EXCLUDE_PATTERNS       = \
                                 */build/* \
                                 */build-ci-linux/* \
                                 */build-mingw64/* \
                                 */.venv/* \
                                 */.git/* \
                                 */.github/*

        EXTRACT_ALL            = YES
        EXTRACT_STATIC         = YES
        EXTRACT_LOCAL_CLASSES  = YES
        EXTRACT_PRIVATE        = NO
        HIDE_UNDOC_MEMBERS     = NO
        HIDE_UNDOC_CLASSES     = NO

        SORT_MEMBER_DOCS       = YES
        SORT_BRIEF_DOCS        = YES
        SORT_BY_SCOPE_NAME     = YES

        GENERATE_HTML          = YES
        HTML_OUTPUT            = html
        HTML_FILE_EXTENSION    = .html
        GENERATE_TREEVIEW      = YES
        FULL_SIDEBAR           = YES
        HTML_DYNAMIC_MENUS     = YES
        SEARCHENGINE           = YES
        SERVER_BASED_SEARCH    = NO

        GENERATE_LATEX         = NO
        GENERATE_MAN           = NO
        GENERATE_RTF           = NO
        GENERATE_XML           = NO

        SOURCE_BROWSER         = YES
        INLINE_SOURCES         = NO
        REFERENCES_RELATION    = YES
        REFERENCED_BY_RELATION = YES
        SHOW_INCLUDE_FILES     = YES
        SHOW_HEADERFILE        = YES

        HAVE_DOT               = YES
        DOT_IMAGE_FORMAT       = svg
        INTERACTIVE_SVG        = YES
        CALL_GRAPH             = YES
        CALLER_GRAPH           = YES
        CLASS_GRAPH            = YES
        COLLABORATION_GRAPH    = YES
        INCLUDE_GRAPH          = YES
        INCLUDED_BY_GRAPH      = YES
        DIRECTORY_GRAPH        = YES
        GROUP_GRAPHS           = YES
        UML_LOOK               = YES
        DOT_NUM_THREADS        = 0

        QUIET                  = NO
        WARNINGS               = YES
        WARN_IF_UNDOCUMENTED   = NO
        WARN_IF_DOC_ERROR      = YES
        EOF

        rm -rf build/client_demo_doxygen html/client_demo
        mkdir -p build/client_demo_doxygen
        doxygen "$RUNNER_TEMP/Doxyfile.client_demo"
        mkdir -p html/client_demo
        cp -a build/client_demo_doxygen/html/. html/client_demo/

    - name: Mark rtt preview deployment
      if: github.event_name == 'push' && github.ref_name == 'rtt'
      run: |
        python3 - <<'PY'
        from pathlib import Path

        banner = (
            '<div style="margin:16px 0;padding:12px 16px;border:1px solid #d0d7de;'
            'border-left:4px solid #f59e0b;background:#fff8db;color:#24292f;">'
            '<strong>RTT preview deployment</strong><br>'
            'This site was published from the <code>rtt</code> branch. '
            'A later deployment from <code>main</code> or <code>doxygen</code> '
            'will replace the live Pages content. '
            'The client demo entry is available at '
            '<a href="client_demo/index.html">client_demo</a>.'
            '</div>'
        )

        for rel in ('html/index.html', 'html/client_demo/index.html'):
            path = Path(rel)
            if not path.exists():
                continue
            text = path.read_text(encoding='utf-8')
            if banner in text:
                continue
            if '<body>' in text:
                text = text.replace('<body>', '<body>\n' + banner, 1)
            else:
                text = banner + text
            path.write_text(text, encoding='utf-8')
        PY

    - name: Upload preview artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-preview-${{ github.ref_name }}
        path: ./html
        if-no-files-found: error

    - name: Upload Pages artifact
      if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'rtt' || github.ref_name == 'doxygen')
      uses: actions/upload-pages-artifact@v3
      with:
        path: './html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'rtt' || github.ref_name == 'doxygen')

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
