# Minimal client_smoke configuration for the Windows TSMaster backend.
#
# Precedence:
#   defaults < this file < UDS_SMOKE_* environment variables
#
# File name lookup order:
#   1) path from UDS_SMOKE_CONF
#   2) ./tsmaster_smoke.conf
#
# Numeric values accept decimal or 0x-prefixed hex where relevant.

app_name = TSMaster
hw_name = CANable 1

app_channel = 0
hw_device_type = 0
hw_device_subtype = 0
hw_index = 0
hw_channel = 0

can_baud_kbps = 1000
canfd_arb_kbps = 500
canfd_data_kbps = 2000

use_canfd = false
use_brs = false
install_term_resistor = false
use_extended_ids = false

phys_rx_id = 0x7E8
phys_tx_id = 0x7E0
func_tx_id = 0x7DF
